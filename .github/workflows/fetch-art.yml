# Fetches generated artwork listed in art-inbox/manifest.json into this branch (the sandbox that builds the site can't
# reach the art host directly). Runs on pushes to this branch only; never merged to main.
name: Fetch art
on:
  push:
    branches: [range-art-inbox]
    paths: [art-inbox/manifest.json]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          for name, url in json.load(open('art-inbox/manifest.json')):
              assert '/' not in name and '..' not in name
              subprocess.run(['curl','-fsSL','-o',f'art-inbox/{name}',url], check=True)
              print(name, os.path.getsize(f'art-inbox/{name}'))
          PY
      - name: Commit
        run: |
          git config user.name "fetch-art"
          git config user.email "fetch-art@users.noreply.github.com"
          git add art-inbox
          git commit -m "Fetch art" && git push
