name: Live site audit
# Audit-only branch: checks what securebydesigninc.com serves against main. Deploys nothing.
on:
  push:
    branches: [audit/live-site]
permissions:
  contents: write
concurrency:
  group: live-audit
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use main's content for the comparison
        run: |
          git fetch origin main
          echo "EXPECTED_SHA=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          git worktree add -q /tmp/main origin/main
          mkdir -p audit-results
      - name: Install Playwright
        if: hashFiles('.github/audit/tests-only') == ''
        run: |
          npm i --prefix /tmp/pw playwright@1.55.0 >/dev/null
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium >/dev/null
          echo "PLAYWRIGHT_MODULE=/tmp/pw/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: HTTP audit
        if: hashFiles('.github/audit/tests-only') == ''
        continue-on-error: true
        run: REPO_DIR=/tmp/main node .github/audit/audit-live-site.mjs
      - name: Browser audit
        if: hashFiles('.github/audit/tests-only') == ''
        continue-on-error: true
        run: node .github/audit/audit-live-browser.mjs
      - name: Repo browser test against the live model
        if: hashFiles('.github/audit/tests-only') == ''
        continue-on-error: true
        run: |
          cd /tmp/main
          sed -i "s#^const url = .*#const url = 'https://securebydesigninc.com/inside-network-model/model.html?qa';#" scripts/check-network-browser.mjs
          node scripts/check-network-browser.mjs > "$GITHUB_WORKSPACE/audit-results/model-browser.txt" 2>&1; echo "exit $?" >> "$GITHUB_WORKSPACE/audit-results/model-browser.txt"
          tail -40 "$GITHUB_WORKSPACE/audit-results/model-browser.txt"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Source tests on main (full suite)
        continue-on-error: true
        run: |
          cd /tmp/main
          pnpm install --frozen-lockfile > /dev/null
          pnpm build > "$GITHUB_WORKSPACE/audit-results/build.txt" 2>&1; echo "build exit $?" >> "$GITHUB_WORKSPACE/audit-results/build.txt"
          { for s in check-network-architecture check-network-relationships check-data-center-equipment check-rmf; do echo "== $s"; node scripts/$s.mjs 2>&1 | tail -4; echo "exit $?"; done
            echo "== node --test"; node --test tests/*.test.mjs 2>&1 | grep -E "^# |^not ok|^ok" ; } > "$GITHUB_WORKSPACE/audit-results/source-tests.txt" 2>&1
          node --test tests/community.test.mjs tests/journal-progress.test.mjs > "$GITHUB_WORKSPACE/audit-results/failing-tests.txt" 2>&1 || true
          cat "$GITHUB_WORKSPACE/audit-results/source-tests.txt"
      - name: DNS snapshot
        if: hashFiles('.github/audit/tests-only') == ''
        continue-on-error: true
        run: |
          for t in NS A AAAA MX TXT CAA; do echo "== $t"; dig +short securebydesigninc.com $t; done > audit-results/dns.txt
          for n in www.securebydesigninc.com _dmarc.securebydesigninc.com notify.securebydesigninc.com send.notify.securebydesigninc.com resend._domainkey.notify.securebydesigninc.com; do echo "== $n"; dig +short $n ANY; dig +short $n TXT; dig +short $n MX; done >> audit-results/dns.txt
          dig +dnssec securebydesigninc.com DS +short >> audit-results/dns.txt; echo "== DS above" >> audit-results/dns.txt
          cat audit-results/dns.txt
      - name: Save results to this branch
        run: |
          git config user.name "Secure By Design"
          git config user.email "w6wvbp4yjn@privaterelay.appleid.com"
          git add audit-results
          git commit -m "Live audit results ($EXPECTED_SHA)" -q || echo "nothing to commit"
          git push origin HEAD:audit/live-site
