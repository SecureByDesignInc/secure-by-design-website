name: Build and deploy

# Pull requests: build and test only (no secrets, nothing deployed).
# Pushes to main (merges) and manual runs: build, test, then deploy to the
# owner's Cloudflare Worker.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Catalog and content tests
        run: node --test tests/video-catalog.test.mjs
      - name: Build
        run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check deploy settings
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          D1: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          missing=""
          [ -n "$TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN(secret)"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID(secret)"
          [ -n "$WORKER" ] || missing="$missing CLOUDFLARE_WORKER_NAME(variable)"
          [ -n "$D1" ] || missing="$missing CLOUDFLARE_D1_DATABASE_ID(variable)"
          if [ -n "$missing" ]; then echo "::error::Missing repository settings:$missing"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          node -e "const c=require('./dist/server/wrangler.json');console.log('::notice title=Deploy target::worker='+c.name+' d1='+JSON.stringify((c.d1_databases||[]).map(d=>d.binding+':'+d.database_name)))"
          pnpm exec wrangler deploy --config dist/server/wrangler.json 2>&1 | tee deploy.log
          grep -E "Uploaded|Deployed|https://|Version ID|Current Version|Triggers|workers.dev" deploy.log | head -12 | while IFS= read -r line; do echo "::notice title=Wrangler::$line"; done
      - name: Verify the deployed Worker
        env:
          WORKER: ${{ vars.CLOUDFLARE_WORKER_NAME }}
        run: |
          sleep 15
          url=$(grep -oE "https://[a-z0-9.-]+\.workers\.dev" deploy.log | head -1)
          [ -n "$url" ] || { echo "::warning title=Verify::No workers.dev URL in deploy output"; exit 0; }
          for path in / /training /training/harden-baseline /videos; do
            code=$(curl -s -o page.html -w '%{http_code} %{redirect_url}' "$url$path")
            title=$(grep -o '<title>[^<]*' page.html | head -1 | sed 's/<title>//')
            mark=$(grep -c 'Harden the baseline' page.html || true)
            echo "::notice title=Verify $path::$url$path -> $code | title: $title | 'Harden the baseline' mentions: $mark"
          done
