name: Browser check

# Pull requests: build the site, run the build locally with Wrangler, and open every page in Chromium.
# Reports Content Security Policy blocks, script errors, failed requests, missing browser protections,
# dead Back links, share-preview tags, and the owner-page and closed-form behaviour as annotations,
# before anything reaches securebydesigninc.com. Nothing is deployed and no secrets are used.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Install a test browser
        run: |
          npm i --prefix "$RUNNER_TEMP/pw" playwright@1.56.0 > /dev/null 2>&1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium > /dev/null 2>&1
      - name: Run the built site locally
        run: |
          # A local copy of the database with the same migrations production has, so account pages answer normally.
          node -e "const c=require('./dist/server/wrangler.json');const d=(c.d1_databases||[])[0];if(d)require('fs').writeFileSync('d1-local.json',JSON.stringify({name:'d1-local',compatibility_date:'2026-01-01',d1_databases:[{binding:d.binding,database_name:d.database_name,database_id:d.database_id,migrations_dir:'drizzle'}]}))"
          if [ -f d1-local.json ]; then
            pnpm exec wrangler d1 migrations apply DB --local --config d1-local.json --persist-to "$RUNNER_TEMP/state" > migrations.log 2>&1 || echo "::warning title=Local database::Migrations did not apply; account pages may show errors."
          fi
          # Wrangler serves the deploy bundle exactly as Cloudflare would; vite preview is the fallback.
          up() { for i in $(seq 1 "$1"); do curl -s -o /dev/null http://127.0.0.1:8787/ && return 0; sleep 1; done; return 1; }
          log() { tail -c 3000 "$1" | tr '\n' '|' | sed 's/%/%25/g'; }
          nohup pnpm exec wrangler dev --config dist/server/wrangler.json --ip 127.0.0.1 --port 8787 --persist-to "$RUNNER_TEMP/state" --var OWNER_EMAIL:owner@example.invalid > wrangler-dev.log 2>&1 &
          if ! up 90; then
            echo "::warning title=wrangler dev did not start::$(log wrangler-dev.log)"
            pkill -f "wrangler dev" || true
            nohup pnpm exec vite preview --host 127.0.0.1 --port 8787 --strictPort > vite-preview.log 2>&1 &
            up 90 || { echo "::error title=vite preview did not start::$(log vite-preview.log)"; exit 1; }
            echo "::notice title=Local site::Running with vite preview"
          fi
          echo "::notice title=Local site::Home $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/) | _headers file $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/_headers) (404 expected) | /grc-rmf-training/rmf/ CSP headers: $(curl -sI http://127.0.0.1:8787/grc-rmf-training/rmf/ | grep -ci content-security-policy)"
      - name: Open every page in Chromium
        env:
          PLAYWRIGHT: ${{ runner.temp }}/pw/node_modules/playwright
        run: node scripts/browser-check.mjs http://127.0.0.1:8787
      - name: Keep the course guide screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guide-screens
          path: guide-screens/
          if-no-files-found: ignore
          retention-days: 7
