name: Live check

# Audit helper (not for main): read-only checks of the live site after the course 1.1 / 1.2 DNS move.
on:
  push:
    branches: ['audit/live']

permissions:
  contents: read

jobs:
  dns-move:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Course pages and files
        run: |
          S=https://securebydesigninc.com
          get() { curl -s -m 30 -A 'Mozilla/5.0 live-check' "$S$1"; }
          has() { if get "$1" | grep -q -- "$2"; then echo "yes"; else echo "NO"; fi; }
          hasnt() { if get "$1" | grep -q -- "$2"; then echo "STILL"; else echo "gone"; fi; }
          sum() { curl -s -m 60 "$S$1" | sha256sum | cut -c1-16; }
          L=$(get /training/dc01-dc02/lesson.json)
          echo "::notice title=1.1 lesson.json::$(echo "$L" | jq -r '"subtitle=\(.subtitle) | verify=\(.chapters[3].short) / \(.chapters[3].title) | foundations=\([.foundations[].id]|join(",")) | sources=\(.sources|length) | wire=\(.chapters[3].wire != null)"')"
          echo "::notice title=1.1 guide page::health control $(has /training/dc01-dc02/index.html 'Health check on') · edition 0.5 $(has /training/dc01-dc02/index.html 'Materials edition 0.5') · DNS query control $(hasnt /training/dc01-dc02/index.html 'DNS query to')"
          echo "::notice title=1.1 files::zip $(sum /training/dc01-dc02/SecureByDesign-DC01-DC02-Learning-Package.zip) · pdf $(sum /training/dc01-dc02/SecureByDesign-DC01-DC02-Workbook.pdf) · cover $(sum /training/dc01-dc02/workbook-cover.webp) · commands showrepl* $(has /training/dc01-dc02/Verification-Commands.txt 'repadmin /showrepl \*')"
          echo "::notice title=1.2 files::pdf $(sum /training/dns-configuration/SecureByDesign-dns-configuration-Workbook.pdf) · checklist loopback $(has /training/dns-configuration/configuration-checklist.md '127.0.0.1') · checklist pktmon $(has /training/dns-configuration/configuration-checklist.md 'pktmon')"
          echo "::notice title=1.2 guide page::plan text $(has /training/dns-configuration 'turns names into addresses') · edition 1.3 $(has /training/dns-configuration 'Edition 1.3')"
          echo "::notice title=Catalog and home::library subtitle $(has /training 'DC01 + DC02 / Active Directory') · old subtitle $(hasnt /training 'Active Directory &amp; DNS') · home text $(has / 'Build two Active Directory domain controllers') · model detail $(has /inside-network-model/courses.js 'Two Active Directory domain controllers')"
