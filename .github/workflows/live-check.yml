name: Live check

# Audit helper (not for main): a few read-only follow-up checks for the re-audit.
on:
  push:
    branches: ['audit/live']

permissions:
  contents: read

jobs:
  public-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retired files still served
        run: |
          for p in /career-roles/catalog.json /career-roles/directory.js /career-roles/layout.css /career-form.js /career-fields.js /career-explorer/explorer.css /career-explorer/roles /resources/secure-by-design-prepare-brief.md /partners/tenable-light.svg; do
            echo "$p -> $(curl -s -o /tmp/b -m 20 -w '%{http_code} %{content_type} %{size_download}B' https://securebydesigninc.com$p)" >> out.txt
          done
          echo "::notice title=Public files::$(paste -sd'|' out.txt)"
  worker-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER: ${{ vars.CLOUDFLARE_WORKER_NAME }}
    steps:
      - name: Worker binding names (values only for the sender's domain and site origin)
        run: |
          r=$(curl -s -m 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER/settings")
          echo "::notice title=Bindings::$(echo "$r" | jq -r 'if .success then ([.result.bindings[] | "\(.name) (\(.type))" + (if .name=="NOTIFICATION_FROM" then " domain=" + ((.text // "")|split("@")|last|rtrimstr(">")) elif .name=="SITE_ORIGIN" then " value=" + (.text // "") else "" end)] | join(" | ")) else "error: \(.errors|tostring)" end')"
          echo "::notice title=Compatibility::$(echo "$r" | jq -r '.result | "date \(.compatibility_date) · flags \(.compatibility_flags|tostring) · logpush \(.logpush) · observability \(.observability|tostring)"')"
