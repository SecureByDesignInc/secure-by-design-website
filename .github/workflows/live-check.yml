name: Live check

# Audit helper (not for main): read-only checks of the live site. This run: My Account after PR #41
# (portfolio track and add-ons hidden; providers, form height, colors). Screenshots go to the live-results branch.
on:
  push:
    branches: ['audit/live']

permissions:
  contents: write

jobs:
  tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Deployed build
        run: echo "::notice title=Build::$(curl -s -m 20 https://securebydesigninc.com/build-info.json)"
      - name: Install a test browser
        run: |
          npm i --prefix "$RUNNER_TEMP/pw" playwright@1.56.0 > /dev/null 2>&1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium > /dev/null 2>&1
      - name: My Account
        env:
          PLAYWRIGHT: ${{ runner.temp }}/pw/node_modules/playwright
        run: node .github/live/account.mjs "$RUNNER_TEMP/out"
      - name: Publish screenshots to live-results
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q -b live-results
          git config user.name "Secure By Design"; git config user.email "w6wvbp4yjn@privaterelay.appleid.com"
          printf '%s\n' "$GITHUB_SHA" > SOURCE.txt
          git add -A; git commit -qm "Live My Account screenshots ($GITHUB_SHA)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:live-results
