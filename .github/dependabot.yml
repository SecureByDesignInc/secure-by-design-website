# Weekly update pull requests for the site's packages and the GitHub Actions it uses.
# Each one runs the normal build, tests and browser check before anyone merges it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ['react', 'react-dom', 'react-server-dom-webpack', '@types/react', '@types/react-dom']
      cloudflare:
        patterns: ['wrangler', '@cloudflare/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
